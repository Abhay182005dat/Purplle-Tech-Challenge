version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./pipeline:/app/pipeline
      - ./web:/app/web
    environment:
      - DATABASE_URL=sqlite:///./data/store_intelligence.db
      - LOG_LEVEL=INFO
      - STORE_LAYOUT_PATH=data/store_layout.json
      - POS_CSV_PATH=data/pos_transactions.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
